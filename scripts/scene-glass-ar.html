<!DOCTYPE html>

#ui{z-index:2;pointer-events:none;background:transparent;}

<body>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7694ad" stroke-opacity=".13"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="lensClip"><circle cx="360" cy="430" r="160"/></clipPath>
</defs>

    <rect x="2600" y="160" width="160" height="170"/><rect x="3200" y="160" width="160" height="170"/>

<!-- FIXED SCREEN SPACE UI -->
<svg id="ui" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;pointer-events:none;background:transparent;">
  <defs>
    <linearGradient id="uiGold" x2="1" y2="0"><stop stop-color="#ffdc86"/><stop offset="1" stop-color="#e99b35"/></linearGradient>
    <radialGradient id="lensBg"><stop stop-color="#26384b"/><stop offset="1" stop-color="#0d1c2b"/></radialGradient>
  </defs>

  <g id="header">
    <rect x="155" y="38" width="410" height="78" rx="38" fill="#101d2b" stroke="#70899e" stroke-width="3"/>

    <text id="counter" x="510" y="88" font-size="23" fill="#ffdb8c" text-anchor="middle">0/7</text>
    <rect x="185" y="123" width="350" height="8" rx="4" fill="#34485b"/>
    <rect id="progress" x="185" y="123" width="0" height="8" rx="4" fill="url(#uiGold)"/>
  </g>

  <rect id="lensDim" x="0" y="140" width="720" height="720" fill="#06111c" opacity="0"/>

  <g id="lens" opacity="0">
    <circle cx="360" cy="430" r="170" fill="#132538" stroke="#b8d8e7" stroke-width="12"/>
    <g clip-path="url(#lensClip)">
      <rect x="190" y="260" width="340" height="340" fill="url(#lensBg)"/>
      <g id="lensHeat" opacity="0">
        <path d="M200 490Q270 450 320 480Q400 430 520 480V600H200Z" fill="url(#orangeGlass)" filter="url(#glow)"/>
        <g fill="#ffe8a6"><circle cx="280" cy="455" r="7"/><circle cx="340" cy="440" r="10"/><circle cx="400" cy="465" r="8"/><circle cx="450" cy="430" r="6"/></g>
      </g>
      <g id="lensBubbles" opacity="0">
        <rect x="190" y="480" width="340" height="120" fill="url(#orangeGlass)"/>
        <g id="bubbleGroup" fill="none" stroke="#fff4d6" stroke-width="5">
          <circle cx="270" cy="500" r="14"/><circle cx="330" cy="465" r="9"/><circle cx="400" cy="510" r="17"/><circle cx="455" cy="450" r="11"/>
        </g>
      </g>
      <g id="lensClear" opacity="0">
        <rect x="190" y="260" width="340" height="340" fill="url(#glass)"/>
        <path d="M230 330L450 330" stroke="#fff" stroke-width="10" opacity=".8"/>
        <circle cx="360" cy="430" r="90" fill="none" stroke="#eaffff" stroke-width="5"/>
      </g>
    </g>
    <circle cx="360" cy="430" r="170" fill="none" stroke="#d9f6ff" stroke-width="10"/>
    <path d="M480 550L550 625" stroke="#c6e6f2" stroke-width="24" stroke-linecap="round"/>
    <path d="M480 550L550 625" stroke="#607e94" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g id="lensLabel" opacity="0">
    <rect x="140" y="645" width="440" height="66" rx="28" fill="#142b3d" stroke="#ffd17b" stroke-width="3"/>
    <text id="lensText" x="360" y="688" text-anchor="middle" font-size="29" font-weight="bold" fill="#fff">انصهار كامل!</text>
  </g>
</svg>
</div>

<script>
"use strict";
const BASE_DUR = 49;
const TIMELINE = [
  {time:0,  stage:0, camera:0},
  {time:11.5, stage:1, camera:320},
  {time:16.0, stage:2, camera:870},
  {time:21.5, stage:3, camera:1420},
  {time:26.5, stage:4, camera:1970},
  {time:30.2, stage:5, camera:2540},
  {time:34.6, stage:6, camera:3070},
  {time:38.0, stage:7, camera:3630},
  {time:44.5, stage:7, camera:3750},
  {time:49.0, stage:7, camera:0, zoomOut:true}
];
const STAGE_TIMES = [11.5, 16.0, 21.5, 26.5, 30.2, 34.6, 38.0];
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const smooth = t => { t = clamp(t,0,1); return t*t*(3-2*t); };
function interpolate(a,b,t) { return a + (b-a)*t; }
function segment(t,a,b) { return smooth((t-a)/(b-a)); }

function cameraAtTime(t) {
  if (t >= 44.5) {
    const k = smooth((t-44.5)/4.5);
    const scale = interpolate(1, 0.165, k);
    const tx = interpolate(-3750, 12, k);
    const ty = interpolate(0, 410, k);
    return {x:tx, y:ty, scale:scale};
  }
  let current = TIMELINE[0], next = TIMELINE[1];
  for (let i=0;i<TIMELINE.length-1;i++) {
    if (t >= TIMELINE[i].time && t < TIMELINE[i+1].time) {
      current = TIMELINE[i]; next = TIMELINE[i+1]; break;
    }
  }
  const p = smooth((t-current.time)/(next.time-current.time));
  return {x: -interpolate(current.camera, next.camera, p), y:0, scale:1};
}

function updateMachines(t) {
  document.querySelectorAll(".machine").forEach(machine => {
    const stage = Number(machine.dataset.stage);
    const start = STAGE_TIMES[stage-1];
    const p = segment(t, start, start+1.4);
    machine.querySelector(".blueprint").style.opacity = String(1-p);
    machine.querySelector(".solid").style.opacity = String(p);
  });
}

const ITEMS = [
  {id:"product0", start:1, end:16},
  {id:"product1", start:15, end:22},
  {id:"product2", start:22, end:30},
  {id:"product3", start:30, end:38},
  {id:"product4", start:38, end:49}
];

function updateProducts(t) {
  ITEMS.forEach(item => {
    const el = $(item.id);
    const p = clamp((t-item.start)/(item.end-item.start),0,1);
    const x = interpolate(480, 4150, p);
    el.setAttribute("transform", `translate(${x} 712)`);
    el.style.opacity = (p <= 0 || p >= 1) ? "0" : "1";
  });
  $("finished").style.opacity = String(segment(t, 40, 44));
}

function updateBelt(t) {
  $("beltLine").setAttribute("stroke-dashoffset", String(-t*95));
  const circles = $("rollers").children;
  for (let i=0;i<circles.length;i++) {
    circles[i].setAttribute("cy", 785 + Math.sin((t*4)+i)*2);
  }
}

function updateLens(t) {
  const inside = (t>=21.5 && t<=30.2);
  $("lens").style.opacity = inside ? "1" : "0";
  $("lensDim").style.opacity = inside ? ".48" : "0";
  $("lensLabel").style.opacity = inside ? "1" : "0";
  $("lensHeat").style.opacity = (t>=21.5 && t<26.5) ? "1" : "0";
  $("lensBubbles").style.opacity = (t>=26.5 && t<29.0) ? "1" : "0";
  $("lensClear").style.opacity = (t>=29.0 && t<=30.2) ? "1" : "0";
  if (t>=21.5 && t<26.5) { $("lensText").textContent = "١٥٠٠°C انصهار كامل!"; $("lensText").setAttribute("fill","#ffdf9b"); }
  if (t>=26.5 && t<29.0) { $("lensText").textContent = "طرد فقاعات الهواء!"; $("lensText").setAttribute("fill","#ff7272"); }
  if (t>=29.0 && t<=30.2) { $("lensText").textContent = "زجاج نقي ١٠٠%!"; $("lensText").setAttribute("fill","#8dffb4"); }
  const p = clamp((t-26.5)/2.5,0,1);
  const circles = $("bubbleGroup").children;
  for (let i=0;i<circles.length;i++) {
    const initialY = [500,465,510,450][i];
    circles[i].setAttribute("cy", initialY - p*110);
    circles[i].style.opacity = String(1 - p*0.95);
  }
}

function updateUI(t) {
  let stage = 0;
  for (let i=0;i<STAGE_TIMES.length;i++) if (t>=STAGE_TIMES[i]) stage=i+1;
  stage = clamp(stage,0,7);
  $("counter").textContent = stage + "/7";
  $("progress").setAttribute("width", 350*(stage/7));
}

window.renderAtTime = function(t, duration, wordTimings) {
  const dur = Number(duration) || BASE_DUR;
  const st = clamp(Number(t)||0, 0, dur) * (BASE_DUR / dur);
  const camera = cameraAtTime(st);
  $("world").setAttribute("transform", `translate(${camera.x} ${camera.y}) scale(${camera.scale})`);
  updateMachines(st);
  updateProducts(st);
  updateBelt(st);
  updateLens(st);
  updateUI(st);
};
window.renderAtTime(0, BASE_DUR, []);
</script>
</body>
</html>
