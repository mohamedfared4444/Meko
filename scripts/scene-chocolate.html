<script>
(function(){
"use strict";
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("factory");
const DURATION=48;
const CENTERS=[300,900,1500,2100,2700,3300,3900,4500];
const dashGroup=document.getElementById("dashes");
for(let i=0;i<8;i++){
 const r=document.createElementNS(NS,"rect");
 r.setAttribute("x",215+i*42);r.setAttribute("y",58);r.setAttribute("width",32);r.setAttribute("height",9);r.setAttribute("rx",5);r.setAttribute("fill","#6e5945");r.setAttribute("id","dash"+i);
 dashGroup.appendChild(r);
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function smooth(a,b,t){const x=clamp((t-a)/(b-a),0,1);return x*x*(3-2*x);}
function setOpacity(id,v){document.getElementById(id).setAttribute("opacity",clamp(v,0,1));}
function setStageVisuals(index,progress){
 for(let i=1;i<=8;i++){
  const group=document.getElementById("s"+i);
  const active=i-1===index;
  const reveal=clamp((progress-(i-1)*0.125)/0.08,0,1);
  group.querySelector(".blueprint").setAttribute("opacity",active?1-reveal:0);
  group.querySelector(".solid").setAttribute("opacity",i-1<index?1:active?reveal:0);
  group.querySelector(".machine-label").setAttribute("opacity",i-1<=index?1:0.25);
 }
}
function setProgress(index,progress){
 const completed=clamp(progress*8,0,8);
 document.getElementById("ring").setAttribute("stroke-dashoffset",163.36*(1-completed/8));
 for(let i=0;i<8;i++)document.getElementById("dash"+i).setAttribute("fill",i<completed?"#eab54d":"#6e5945");
 document.getElementById("stepText").textContent=Math.min(index+1,8)+"/8";
}
function setLens(stage,stageProgress){
 const visible=stage===3||stage===6;
 let visibility=0;
 if(visible)visibility=stageProgress<.15?smooth(0,.15,stageProgress):stageProgress>.9?1-smooth(.9,1,stageProgress):1;
 document.getElementById("lens").setAttribute("opacity",visibility);
 setOpacity("lensPress",stage===3?1:0);
 setOpacity("lensCrystal",stage===6?1:0);
 setOpacity("tooWarm",stage===6&&stageProgress>.15&&stageProgress<.45?1:0);
 setOpacity("snapReady",stage===6&&stageProgress>=.45?1:0);
 const scale=.75+.25*smooth(.15,.5,stageProgress);
 document.getElementById("crystalShapes").setAttribute("transform","translate(360 400) scale("+scale+") translate(-360 -400)");
}
function renderAtTime(t,duration,wordTimings){
 duration=Number(duration)||DURATION;
 t=clamp(Number(t)||0,0,duration);
 const panEnd=Math.max(duration-4.5,duration*0.88);
 const stageProgressOverall=clamp(t/panEnd,0,1);
 const stage=Math.min(7,Math.floor(stageProgressOverall*8));
 const local=clamp(stageProgressOverall*8-stage,0,1);
 setStageVisuals(stage,stageProgressOverall);
 setProgress(stage,stageProgressOverall);
 setLens(stage,local);
 const segment=stageProgressOverall*7;
 const a=Math.min(6,Math.floor(segment));
 const fraction=segment-a;
 const cameraCenter=CENTERS[a]+(CENTERS[a+1]-CENTERS[a])*smooth(0,1,fraction);
 const zoom=smooth(panEnd,duration,t);
 const viewWidth=720+(4800-720)*zoom;
 const viewHeight=viewWidth*1280/720;
 const viewX=(cameraCenter*(1-zoom)+2400*zoom)-viewWidth/2;
 const viewY=450-viewHeight*0.42;
 svg.setAttribute("viewBox",[viewX,viewY,viewWidth,viewHeight].join(" "));
 window.currentWordTimings=wordTimings||[];
}
window.renderAtTime=renderAtTime;
renderAtTime(0,DURATION,[]);
})();
</script>
